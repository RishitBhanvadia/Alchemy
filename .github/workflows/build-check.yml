# .github/workflows/build-check.yml
name: Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - run: cd client && pnpm install
      - run: cd client && pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_API_URL: https://placeholder.example.com/api

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - run: cd server && pnpm install
      - name: Check server syntax/startup
        run: |
          cd server
          node -e "try { require('./server.js'); setTimeout(() => process.exit(0), 1000); } catch (e) { if (e.message && e.message.includes('STARTUP FAILED')) process.exit(0); throw e; }"
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GEMINI_API_KEY: placeholder
          PORT: 5001
          NODE_ENV: test
